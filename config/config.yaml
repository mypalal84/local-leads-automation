api:
  serper_api_key: "${SERPER_API_KEY}"

pipeline:
  daily_email_target: 50
  expected_sends_per_pair: 5
  max_pairs_per_run: 10
  enrich_buffer_multiplier: 2
  max_enrich_leads_per_pair: 25
  sleep_seconds: 10
  zero_send_streak_stop: 6

discovery:
  search_calls: 3
  target_leads: 25
  details_fallback_limit: 5
  parallel:
    enabled: true
    max_jobs: 3
    stagger_seconds: 3

enrichment:
  pre_enrich_score_filter: true
  lead_score_threshold: 2
  hunter_max_domains_per_lead: 3

outreach:
  daily_email_target: 50
  max_emails_per_domain: 2
  pre_send_validate_emails: true

logging:
  structured:
    enabled: true
