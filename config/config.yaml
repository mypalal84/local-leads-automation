api:
  serper_api_key: "${SERPER_API_KEY}"

pipeline:
  daily_email_target: 50
  expected_sends_per_pair: 5
  max_pairs_per_run: 10
  enrich_buffer_multiplier: 2
  max_enrich_leads_per_pair: 15
  sleep_seconds: 45
  zero_send_streak_stop: 6

discovery:
  search_calls: 2
  target_leads: 15
  details_fallback_limit: 2
  parallel:
    enabled: true
    max_jobs: 3
    stagger_seconds: 3

enrichment:
  pre_enrich_score_filter: false
  lead_score_threshold: 0

outreach:
  daily_email_target: 50
  max_emails_per_domain: 2
  pre_send_validate_emails: true
